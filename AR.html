<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>AR恐竜図鑑 カメラ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6sOyrSwjY7fZaPEGDvn0iormTPWhjQsY",
      authDomain: "ar-stamp-6d9ed.firebaseapp.com",
      projectId: "ar-stamp-6d9ed",
      storageBucket: "ar-stamp-6d9ed.firebasestorage.app",
      messagingSenderId: "238550666098",
      appId: "1:238550666098:web:8c161928290c093bf8abeb",
      measurementId: "G-44D1V7P76C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let uid = "";

    signInAnonymously(auth).catch((error) => {
      console.error("ログインエラー:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        uid = user.uid;
        console.log("Firebaseログイン完了:", uid);
      }
    });

    window.db = db;
    window.getUid = () => uid;
    window.setDocRef = setDoc;
    window.docRef = doc;
  </script>

  <script>
    AFRAME.registerComponent('swipe-rotate', {
      schema: {
        speed: { default: 0.35 }
      },

      init: function () {
        this.touchStartX = 0;
        this.isDragging = false;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          this.isDragging = true;
          this.touchStartX = e.touches[0].clientX;
        });

        window.addEventListener('touchend', () => {
          this.isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
          if (!this.isDragging) return;
          if (e.touches.length !== 1) return;

          const currentX = e.touches[0].clientX;
          const deltaX = currentX - this.touchStartX;
          const rotation = this.el.getAttribute('rotation');

          this.el.setAttribute('rotation', {
            x: 0,
            y: rotation.y + deltaX * this.data.speed,
            z: 0
          });

          this.touchStartX = currentX;
        });
      }
    });

    AFRAME.registerComponent('auto-center', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const clone = mesh.clone();
          clone.position.set(0, 0, 0);
          clone.rotation.set(0, 0, 0);
          clone.scale.set(1, 1, 1);
          clone.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(clone);
          const center = new THREE.Vector3();
          box.getCenter(center);

          this.el.setAttribute('position', {
            x: -center.x,
            y: -center.y,
            z: -center.z
          });
        });
      }
    });
  </script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
      width: 100%;
      height: 100%;
    }

    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2147483647 !important;
      transition: opacity 0.4s ease;
    }

    .start-card {
      width: 90%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .start-card h1 {
      margin: 0 0 16px;
      color: #333;
      font-size: 28px;
    }

    .start-card p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    #model-name {
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .progress-wrap {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #4f46e5;
      transition: width 0.2s ease;
    }

    #progress-text {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    #ar-button {
      display: none;
      width: 100%;
      margin-top: 24px;
      padding: 16px 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #ar-container {
      width: 100vw;
      height: 100vh;
    }

    #collect-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      font-weight: bold;
      display: none;
      z-index: 2147483647 !important;
      pointer-events: auto !important;
    }

    #collection-link {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px;
      text-decoration: none;
      border-radius: 5px;
      z-index: 2147483647 !important;
      pointer-events: auto !important;
    }

    #back-link {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px;
      text-decoration: none;
      border-radius: 5px;
      z-index: 2147483647 !important;
      pointer-events: auto !important;
    }

    #model-loading-indicator {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 16px 20px;
      border-radius: 15px;
      display: none;
      z-index: 2147483647 !important;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
    }

    #camera-debug {
      position: fixed;
      left: 8px;
      top: 70px;
      background: rgba(0,0,0,0.75);
      color: #00ff99;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      z-index: 2147483647 !important;
      text-align: left;
      max-width: 300px;
      display: none;
      white-space: pre-line;
      pointer-events: none;
    }

    video,
    #arjs-video {
      position: fixed !important;
      object-fit: contain !important;
      z-index: 0 !important;
      background: black !important;
    }

    canvas,
    .a-canvas {
      position: fixed !important;
      z-index: 1 !important;
    }  
  </style>
</head>

<body>
  <div id="start-screen">
    <div class="start-card">
      <h1>恐竜ARラリー</h1>
      <p>
        3Dモデルを読み込んでいます。<br>
        完了後にカメラを起動できます。
      </p>

      <div id="model-name">準備中...</div>

      <div class="progress-wrap">
        <div id="progress-bar"></div>
      </div>

      <div id="progress-text">0%</div>

      <button id="ar-button">ARを開始する</button>
    </div>
  </div>

  <div id="ar-container"></div>

  <button id="collect-btn">今のをゲットする！</button>

  <a id="back-link" href="index.html">戻る</a>
  <a id="collection-link" href="collection.html">図鑑を見る</a>

  <div id="model-loading-indicator">モデルを表示中...</div>
  <div id="camera-debug">camera debug</div>

  <template id="ar-template">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
      renderer="colorManagement: true; exposure: 1.2;"
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
    >
      <a-assets>
        <a-asset-item id="Protoceratops-asset" src="models/プロトケラトプス/Protoceratops.glb"></a-asset-item>
        <a-asset-item id="Ravjaa-asset" src="models/ラウジャア/Ravjaa.glb"></a-asset-item>
        <a-asset-item id="Zavacephale-asset" src="models/サヴァケファレ/Zavacephale.glb"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; color: #BBB; intensity: 1.5"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

      <a-marker type="pattern" url="markers/pattern-stanp1.patt" id="Protoceratops">
        <a-entity swipe-rotate>
          <a-entity rotation="0 0 0">
            <a-entity
              gltf-model="#Protoceratops-asset"
              scale="1 1 1"
              auto-center>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="markers/pattern-stanp2.patt" id="Ravjaa">
        <a-entity swipe-rotate>
          <a-entity rotation="0 0 0">
            <a-entity
              gltf-model="#Ravjaa-asset"
              scale="1 1 1"
              auto-center>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-marker type="pattern" url="markers/pattern-stanp4.patt" id="Zavacephale">
        <a-entity swipe-rotate>
          <a-entity rotation="0 0 0">
            <a-entity
              gltf-model="#Zavacephale-asset"
              scale="0.07 0.07 0.07"
              auto-center>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </template>

  <script>
    const modelFiles = [
      {
        name: "プロトケラトプス",
        url: "models/プロトケラトプス/Protoceratops.glb"
      },
      {
        name: "ラウジャア",
        url: "models/ラウジャア/Ravjaa.glb"
      },
      {
        name: "サヴァケファレ",
        url: "models/サヴァケファレ/Zavacephale.glb"
      }
    ];

    const markerNames = {
      Protoceratops: "プロトケラトプス",
      Ravjaa: "ラウジャア",
      Zavacephale: "サヴァケファレ"
    };

    let currentMarkerId = "";
    let cameraDebugTimer = null;
    let cameraFixTimer = null;

    const modelNameEl = document.getElementById("model-name");
    const progressBarEl = document.getElementById("progress-bar");
    const progressTextEl = document.getElementById("progress-text");
    const arButton = document.getElementById("ar-button");

    function setProgress(percent, text) {
      const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
      progressBarEl.style.width = `${safePercent}%`;
      progressTextEl.innerText = text || `${safePercent}%`;
    }

    function preloadFileWithProgress(file, index, total) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", file.url, true);
        xhr.responseType = "blob";

        xhr.onprogress = (event) => {
          if (event.lengthComputable) {
            const filePercent = event.loaded / event.total;
            const overall = ((index + filePercent) / total) * 100;
            modelNameEl.innerText = `${file.name} を読み込み中...`;
            setProgress(overall, `${file.name}: ${Math.round(filePercent * 100)}%`);
          } else {
            const overall = (index / total) * 100;
            modelNameEl.innerText = `${file.name} を読み込み中...`;
            setProgress(overall, `${file.name}: 読み込み中...`);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            console.log("事前読み込み完了:", file.url, xhr.response.size);
          } else {
            console.warn("事前読み込み失敗:", file.url, xhr.status);
          }

          resolve();
        };

        xhr.onerror = () => {
          console.warn("事前読み込みエラー:", file.url);
          resolve();
        };

        xhr.send();
      });
    }

    async function preloadModels() {
      arButton.style.display = "none";
      setProgress(0, "0%");

      for (let i = 0; i < modelFiles.length; i++) {
        await preloadFileWithProgress(modelFiles[i], i, modelFiles.length);
      }

      modelNameEl.innerText = "準備完了";
      setProgress(100, "100%");
      arButton.style.display = "block";
    }

    function startAR() {
      const startScreen = document.getElementById("start-screen");
      const arContainer = document.getElementById("ar-container");
      const template = document.getElementById("ar-template");

      if (!arContainer.querySelector("a-scene")) {
        arContainer.appendChild(template.content.cloneNode(true));
      }

      setupMarkerEvents();
      setupModelLoadingEvents();
      setupCollectButton();
      startCameraDebug();
      startCameraFix();

      forceUIFront();

      startScreen.style.opacity = "0";

      setTimeout(() => {
        startScreen.style.display = "none";
        forceUIFront();
      }, 400);
    }

    function forceUIFront() {
      const ids = [
        "collect-btn",
        "collection-link",
        "back-link",
        "model-loading-indicator",
        "camera-debug"
      ];

      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.zIndex = "2147483647";
      });
    }

    function fixCameraView() {
      const video = document.querySelector("video");
      const canvas = document.querySelector("canvas");
      const scene = document.querySelector("a-scene");

      if (!video) return;

      const cssW = document.documentElement.clientWidth;
      const cssH = document.documentElement.clientHeight;

      const realW = video.videoWidth || 480;
      const realH = video.videoHeight || 640;

      const screenRatio = cssW / cssH;
      const videoRatio = realW / realH;

      let displayW;
      let displayH;

      // カメラ映像を画面内に収める contain 表示
      if (screenRatio > videoRatio) {
        displayH = cssH;
        displayW = displayH * videoRatio;
      } else {
        displayW = cssW;
        displayH = displayW / videoRatio;
      }

      const left = (cssW - displayW) / 2;
      const top = (cssH - displayH) / 2;

      const commonStyle = {
        position: "fixed",
        left: `${left}px`,
        top: `${top}px`,
        width: `${displayW}px`,
        height: `${displayH}px`,
        maxWidth: "none",
        maxHeight: "none",
        transform: "none",
        objectFit: "contain"
      };

      Object.assign(video.style, commonStyle);
      video.style.zIndex = "0";
      video.style.background = "black";

      if (canvas) {
        Object.assign(canvas.style, commonStyle);
        canvas.style.zIndex = "1";

        // canvasの内部解像度も表示サイズに寄せる
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(displayW * dpr);
        canvas.height = Math.round(displayH * dpr);
      }

      if (scene) {
        scene.style.position = "fixed";
        scene.style.left = "0";
        scene.style.top = "0";
        scene.style.width = `${cssW}px`;
        scene.style.height = `${cssH}px`;
      }
    }

    function startCameraFix() {
      if (cameraFixTimer) {
        clearInterval(cameraFixTimer);
      }

      cameraFixTimer = setInterval(() => {
        fixCameraView();
        forceUIFront();
      }, 300);
    }

    function setupMarkerEvents() {
      const collectBtn = document.getElementById("collect-btn");
      const markers = document.querySelectorAll("a-marker");

      markers.forEach((marker) => {
        marker.addEventListener("markerFound", () => {
          currentMarkerId = marker.id;
          collectBtn.style.display = "block";
          console.log("マーカー認識:", marker.id);
          forceUIFront();
        });

        marker.addEventListener("markerLost", () => {
          if (currentMarkerId === marker.id) {
            currentMarkerId = "";
          }

          collectBtn.style.display = "none";
          console.log("マーカー解除:", marker.id);
          forceUIFront();
        });
      });
    }

    function setupModelLoadingEvents() {
      const indicator = document.getElementById("model-loading-indicator");

      const models = [
        {
          selector: '#Protoceratops [gltf-model]',
          name: "プロトケラトプス"
        },
        {
          selector: '#Ravjaa [gltf-model]',
          name: "ラウジャア"
        },
        {
          selector: '#Zavacephale [gltf-model]',
          name: "サヴァケファレ"
        }
      ];

      models.forEach((item) => {
        const modelEl = document.querySelector(item.selector);

        if (!modelEl) return;

        modelEl.addEventListener("model-loaded", () => {
          console.log(`${item.name} モデル読み込み完了`);
          indicator.style.display = "none";
          forceUIFront();
        });

        modelEl.addEventListener("model-error", () => {
          console.error(`${item.name} モデル読み込み失敗`);
          indicator.innerText = `${item.name} の表示に失敗しました`;
          indicator.style.display = "block";
          forceUIFront();

          setTimeout(() => {
            indicator.style.display = "none";
          }, 2000);
        });
      });
    }

    function setupCollectButton() {
      const collectBtn = document.getElementById("collect-btn");

      collectBtn.onclick = async () => {
        const uid = window.getUid();

        if (!uid) {
          alert("ログイン中です。少々お待ちください。");
          return;
        }

        if (!currentMarkerId) {
          alert("マーカーを読み取ってください。");
          return;
        }

        try {
          const db = window.db;
          const setDoc = window.setDocRef;
          const doc = window.docRef;

          await setDoc(doc(db, "users", uid, "collections", currentMarkerId), {
            markerId: currentMarkerId,
            timestamp: new Date()
          });

          const name = markerNames[currentMarkerId] || currentMarkerId;
          alert(`${name} をコレクションに追加しました！`);
          collectBtn.style.display = "none";
        } catch (e) {
          console.error("保存失敗:", e);
          alert("保存に失敗しました。");
        }
      };
    }

    function startCameraDebug() {
      const debugEl = document.getElementById("camera-debug");
      debugEl.style.display = "block";
      forceUIFront();

      if (cameraDebugTimer) {
        clearInterval(cameraDebugTimer);
      }

      cameraDebugTimer = setInterval(() => {
        const video = document.querySelector("video");
        const canvas = document.querySelector("canvas");

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        if (!video) {
          debugEl.innerText =
            `画面: ${screenW} x ${screenH}\n` +
            `video: まだ生成されていません`;
          forceUIFront();
          return;
        }

        const rect = video.getBoundingClientRect();
        const canvasRect = canvas ? canvas.getBoundingClientRect() : null;

        const videoRealW = video.videoWidth || 0;
        const videoRealH = video.videoHeight || 0;

        const videoDisplayW = Math.round(rect.width);
        const videoDisplayH = Math.round(rect.height);

        const realRatio = videoRealH ? (videoRealW / videoRealH).toFixed(2) : "-";
        const screenRatio = (screenW / screenH).toFixed(2);

        debugEl.innerText =
          `画面: ${screenW} x ${screenH} / 比率 ${screenRatio}\n` +
          `video表示: ${videoDisplayW} x ${videoDisplayH}\n` +
          `video実サイズ: ${videoRealW} x ${videoRealH} / 比率 ${realRatio}\n` +
          `canvas表示: ${canvasRect ? Math.round(canvasRect.width) + " x " + Math.round(canvasRect.height) : "なし"}`;

        forceUIFront();
      }, 1000);
    }

    arButton.addEventListener("click", startAR);

    preloadModels();
  </script>
</body>
</html>
